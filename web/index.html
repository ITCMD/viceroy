<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f26b1d" />
    <link rel="icon" href="/favicon-butterfly.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-butterfly.png" />
    <script>
      // Use the classic icon right away if this household turned the butterfly off (see AppLogo.tsx).
      try {
        if (localStorage.getItem("viceroy.logo") === "classic") {
          document.querySelector('link[rel="icon"]').setAttribute("href", "/icon.svg");
          document.querySelector('link[rel="icon"]').setAttribute("type", "image/svg+xml");
          document.querySelector('link[rel="apple-touch-icon"]').setAttribute("href", "/icon.svg");
        }
      } catch {}
    </script>
    <title>Viceroy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
